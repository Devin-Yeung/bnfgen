[package]
name = "bnfgen-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
logos = "0.16.1"
lalrpop-util = "0.23.1"

# External-lexer setup: the built-in terminal lexer is not needed, and
# keeping it off makes the LALRPOP dependency smaller.
[build-dependencies]
lalrpop = { version = "0.23.1", default-features = false }
