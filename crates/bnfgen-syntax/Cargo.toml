[package]
name = "bnfgen-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
logos = "0.16.1"

# Text snapshots for the normalized public-seam representation. insta matches
# the version pinned in `bnfgen-cli`; termtree draws the eza-style Unicode
# tree. No extra features needed.
[dev-dependencies]
insta = "1.47.2"
termtree = "1.0.0"
walkdir = "2.5.0"
