[package]
name = "bnfgen-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
logos = "0.16.1"
lalrpop-util = "0.23.1"

# Text snapshots for the normalized public-seam representation (ticket
# 02). insta matches the version pinned in `bnfgen-cli`; termtree draws
# the eza-style Unicode tree. No extra features needed.
[dev-dependencies]
insta = "1.47.2"
termtree = "1.0.0"

# External-lexer setup: the built-in terminal lexer is not needed, and
# keeping it off makes the LALRPOP dependency smaller.
[build-dependencies]
lalrpop = { version = "0.23.1", default-features = false }
